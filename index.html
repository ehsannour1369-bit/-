<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اوکیدد — پنل مدیریت</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap');

  :root {
    --purple: #7c3aed;
    --purple-light: #ede9fe;
    --purple-dark: #5b21b6;
    --orange: #ea580c;
    --green: #16a34a;
    --red: #dc2626;
    --gray-50: #f9fafb;
    --gray-100: #f3f4f6;
    --gray-200: #e5e7eb;
    --gray-500: #6b7280;
    --gray-700: #374151;
    --gray-900: #111827;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Vazirmatn', sans-serif;
    background: var(--gray-50);
    color: var(--gray-900);
    min-height: 100vh;
  }

  /* ─── LOGIN ─── */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #7c3aed 0%, #5b21b6 50%, #1e1b4b 100%);
    padding: 20px;
  }

  .login-card {
    background: white;
    border-radius: 24px;
    padding: 48px 40px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.25);
  }

  .logo {
    text-align: center;
    margin-bottom: 32px;
  }

  .logo-emoji { font-size: 48px; display: block; margin-bottom: 8px; }

  .logo h1 {
    font-size: 28px;
    font-weight: 800;
    color: var(--purple);
    letter-spacing: -1px;
  }

  .logo p { color: var(--gray-500); font-size: 14px; margin-top: 4px; }

  .form-group { margin-bottom: 16px; }

  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--gray-700);
    margin-bottom: 6px;
  }

  .form-group input, .form-group select {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid var(--gray-200);
    border-radius: 12px;
    font-family: 'Vazirmatn', sans-serif;
    font-size: 14px;
    transition: border-color 0.2s;
    direction: ltr;
    text-align: left;
  }

  .form-group input:focus, .form-group select:focus {
    outline: none;
    border-color: var(--purple);
  }

  .btn {
    width: 100%;
    padding: 14px;
    background: var(--purple);
    color: white;
    border: none;
    border-radius: 12px;
    font-family: 'Vazirmatn', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    margin-top: 8px;
  }

  .btn:hover { background: var(--purple-dark); }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .quick-logins {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--gray-200);
  }

  .quick-logins p {
    font-size: 12px;
    color: var(--gray-500);
    text-align: center;
    margin-bottom: 12px;
  }

  .quick-btns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .quick-btn {
    padding: 10px;
    border: 2px solid var(--gray-200);
    border-radius: 10px;
    background: white;
    cursor: pointer;
    font-family: 'Vazirmatn', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--gray-700);
    transition: all 0.2s;
    text-align: center;
  }

  .quick-btn:hover { border-color: var(--purple); color: var(--purple); background: var(--purple-light); }

  .error-msg {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: var(--red);
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    margin-top: 12px;
    display: none;
  }

  /* ─── APP ─── */
  #app-screen { display: none; }

  .sidebar {
    position: fixed;
    top: 0; right: 0;
    width: 260px;
    height: 100vh;
    background: white;
    border-left: 1px solid var(--gray-200);
    padding: 24px 0;
    overflow-y: auto;
    z-index: 100;
  }

  .sidebar-brand {
    padding: 0 24px 24px;
    border-bottom: 1px solid var(--gray-100);
    margin-bottom: 16px;
  }

  .sidebar-brand .brand-name {
    font-size: 20px;
    font-weight: 800;
    color: var(--purple);
  }

  .sidebar-user {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
  }

  .avatar-circle {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--purple-light);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  .user-info { flex: 1; min-width: 0; }
  .user-name { font-size: 13px; font-weight: 700; color: var(--gray-900); }
  .user-role { font-size: 11px; color: var(--gray-500); }

  .nav-section {
    padding: 0 12px;
    margin-bottom: 8px;
  }

  .nav-section-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--gray-500);
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 8px 12px 4px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    color: var(--gray-700);
    transition: all 0.15s;
    margin-bottom: 2px;
  }

  .nav-item:hover { background: var(--gray-100); }
  .nav-item.active { background: var(--purple-light); color: var(--purple); font-weight: 700; }
  .nav-item .icon { font-size: 18px; width: 24px; text-align: center; }

  .logout-btn {
    margin: 16px 12px 0;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    color: var(--red);
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background 0.15s;
    border: none;
    background: none;
    font-family: 'Vazirmatn', sans-serif;
    width: calc(100% - 24px);
  }

  .logout-btn:hover { background: #fef2f2; }

  .main-content {
    margin-right: 260px;
    padding: 32px;
    min-height: 100vh;
  }

  .page-title {
    font-size: 24px;
    font-weight: 800;
    color: var(--gray-900);
    margin-bottom: 24px;
  }

  /* ─── CARDS ─── */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }

  .stat-card {
    background: white;
    border-radius: 16px;
    padding: 24px;
    border: 1px solid var(--gray-200);
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .stat-icon {
    width: 52px; height: 52px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    flex-shrink: 0;
  }

  .stat-icon.purple { background: var(--purple-light); }
  .stat-icon.orange { background: #fff7ed; }
  .stat-icon.green  { background: #f0fdf4; }
  .stat-icon.blue   { background: #eff6ff; }

  .stat-value { font-size: 28px; font-weight: 800; color: var(--gray-900); line-height: 1; }
  .stat-label { font-size: 12px; color: var(--gray-500); margin-top: 4px; }

  /* ─── TABLE ─── */
  .card {
    background: white;
    border-radius: 16px;
    border: 1px solid var(--gray-200);
    overflow: hidden;
    margin-bottom: 24px;
  }

  .card-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--gray-100);
    font-size: 16px;
    font-weight: 700;
    color: var(--gray-900);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  table { width: 100%; border-collapse: collapse; }

  th {
    background: var(--gray-50);
    padding: 12px 20px;
    font-size: 12px;
    font-weight: 700;
    color: var(--gray-500);
    text-align: right;
    border-bottom: 1px solid var(--gray-200);
  }

  td {
    padding: 14px 20px;
    font-size: 14px;
    color: var(--gray-700);
    border-bottom: 1px solid var(--gray-100);
    vertical-align: middle;
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--gray-50); }

  /* ─── BADGES ─── */
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }

  .badge-purple { background: var(--purple-light); color: var(--purple); }
  .badge-green  { background: #f0fdf4; color: var(--green); }
  .badge-orange { background: #fff7ed; color: var(--orange); }
  .badge-blue   { background: #eff6ff; color: #2563eb; }
  .badge-gray   { background: var(--gray-100); color: var(--gray-500); }

  /* ─── PROGRESS BAR ─── */
  .progress-bar {
    width: 100%;
    height: 8px;
    background: var(--gray-200);
    border-radius: 4px;
    overflow: hidden;
    margin-top: 4px;
  }

  .progress-fill {
    height: 100%;
    background: var(--purple);
    border-radius: 4px;
    transition: width 0.5s ease;
  }

  /* ─── BOOK CARDS ─── */
  .book-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
    margin-bottom: 24px;
  }

  .book-card {
    background: white;
    border-radius: 16px;
    border: 1px solid var(--gray-200);
    padding: 24px;
    transition: box-shadow 0.2s;
    cursor: pointer;
  }

  .book-card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.1); }

  .book-emoji { font-size: 40px; margin-bottom: 12px; }

  .book-title { font-size: 16px; font-weight: 700; color: var(--gray-900); margin-bottom: 4px; }
  .book-subject { font-size: 13px; color: var(--gray-500); margin-bottom: 16px; }

  .book-stats {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--gray-500);
    margin-bottom: 8px;
  }

  /* ─── LOADING ─── */
  .loading {
    text-align: center;
    padding: 48px;
    color: var(--gray-500);
    font-size: 14px;
  }

  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--gray-200);
    border-top-color: var(--purple);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ─── LESSON LIST ─── */
  .lesson-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--gray-100);
    transition: background 0.15s;
  }

  .lesson-item:last-child { border-bottom: none; }
  .lesson-item:hover { background: var(--gray-50); }

  .lesson-num {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: var(--purple-light);
    color: var(--purple);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .lesson-num.done { background: #f0fdf4; color: var(--green); }

  .lesson-info { flex: 1; }
  .lesson-title { font-size: 14px; font-weight: 600; color: var(--gray-900); }
  .lesson-chapter { font-size: 12px; color: var(--gray-500); margin-top: 2px; }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 768px) {
    .sidebar { width: 100%; height: auto; position: relative; border-left: none; border-bottom: 1px solid var(--gray-200); }
    .main-content { margin-right: 0; padding: 16px; }
    .stat-grid { grid-template-columns: 1fr 1fr; }
  }

  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--gray-500);
  }

  .empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  .api-url {
    background: var(--gray-100);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    color: var(--gray-500);
    font-family: monospace;
    margin-bottom: 20px;
    direction: ltr;
    text-align: left;
  }
</style>
</head>
<body>

<!-- ══════════════════ LOGIN ══════════════════ -->
<div id="login-screen">
  <div class="login-card">
    <div class="logo">
      <span class="logo-emoji">🦁</span>
      <h1>اوکیدد</h1>
      <p>پلتفرم آموزشی گیمیفای‌شده K-12</p>
    </div>

    <div class="form-group">
      <label>ایمیل</label>
      <input type="email" id="email-input" placeholder="admin@okidd.ir" />
    </div>
    <div class="form-group">
      <label>رمز عبور</label>
      <input type="password" id="pass-input" placeholder="••••••••" />
    </div>

    <button class="btn" id="login-btn" onclick="doLogin()">ورود به سیستم</button>
    <div class="error-msg" id="login-error"></div>

    <div class="quick-logins">
      <p>ورود سریع با حساب‌های دمو:</p>
      <div class="quick-btns">
        <button class="quick-btn" onclick="quickLogin('admin@okidd.ir','Admin1234!')">👑 مدیر کل</button>
        <button class="quick-btn" onclick="quickLogin('school@okidd.ir','School1234!')">🏫 مدرسه</button>
        <button class="quick-btn" onclick="quickLogin('teacher@okidd.ir','Teacher1234!')">👩‍🏫 معلم</button>
        <button class="quick-btn" onclick="quickLogin('parent@okidd.ir','Parent1234!')">👨‍👧 والدین</button>
        <button class="quick-btn" onclick="quickLogin('student@okidd.ir','Student1234!')" style="grid-column:span 2">🎮 دانش‌آموز</button>
      </div>
    </div>
  </div>
</div>

<!-- ══════════════════ APP ══════════════════ -->
<div id="app-screen">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-name">🦁 اوکیدد</div>
      <div class="sidebar-user">
        <div class="avatar-circle" id="sb-avatar">👤</div>
        <div class="user-info">
          <div class="user-name" id="sb-name">—</div>
          <div class="user-role" id="sb-role">—</div>
        </div>
      </div>
    </div>

    <div class="nav-section" id="nav-links"></div>

    <button class="logout-btn" onclick="logout()">🚪 خروج از حساب</button>
  </div>

  <div class="main-content" id="main-content">
    <div class="loading"><div class="spinner"></div>در حال بارگذاری...</div>
  </div>
</div>

<script>
const API = '';  // same origin
let token = null;
let currentUser = null;

const ROLE_LABELS = {
  admin:'مدیر کل', school:'مدیر مدرسه', school_temp:'مدرسه (موقت)',
  teacher:'معلم', teacher_temp:'معلم (موقت)',
  parent:'والدین', parent_temp:'والدین (موقت)',
  student:'دانش‌آموز', student_temp:'دانش‌آموز (موقت)'
};

const ROLE_EMOJI = {
  admin:'👑', school:'🏫', teacher:'👩‍🏫',
  parent:'👨‍👧', student:'🎮'
};

const NAV_CONFIG = {
  admin: [
    { label:'داشبورد', icon:'📊', page:'admin-dashboard' },
    { label:'کاربران', icon:'👥', page:'admin-users' },
    { label:'کتاب‌ها', icon:'📚', page:'admin-books' },
    { label:'درس‌ها', icon:'📖', page:'admin-lessons' },
    { label:'مجوزها', icon:'🎫', page:'admin-grants' },
  ],
  school: [
    { label:'داشبورد', icon:'📊', page:'school-dashboard' },
    { label:'کلاس‌ها', icon:'🏛️', page:'school-classes' },
    { label:'مجوزها', icon:'🎫', page:'school-grants' },
  ],
  teacher: [
    { label:'کلاس‌های من', icon:'🏛️', page:'teacher-classes' },
  ],
  parent: [
    { label:'فرزندان من', icon:'👧', page:'parent-children' },
  ],
  student: [
    { label:'کتاب‌های من', icon:'📚', page:'student-books' },
    { label:'پروفایل', icon:'🎮', page:'student-profile' },
  ],
};

async function api(path, opts = {}) {
  const res = await fetch(API + '/api' + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}), ...(opts.headers||{}) }
  });
  return res.json();
}

async function doLogin() {
  const email = document.getElementById('email-input').value;
  const pass  = document.getElementById('pass-input').value;
  if (!email || !pass) return;

  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = 'در حال ورود...';

  const data = await api('/auth/login', { method:'POST', body: JSON.stringify({ email, password: pass }) });

  btn.disabled = false; btn.textContent = 'ورود به سیستم';

  if (data.error) {
    const el = document.getElementById('login-error');
    el.textContent = data.error === 'Invalid email or password' ? 'ایمیل یا رمز اشتباه است' : data.error;
    el.style.display = 'block';
    return;
  }

  token = data.data.token;
  currentUser = data.data.user;
  showApp();
}

function quickLogin(email, pass) {
  document.getElementById('email-input').value = email;
  document.getElementById('pass-input').value = pass;
  doLogin();
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';

  const role = currentUser.role.replace('_temp','');
  document.getElementById('sb-name').textContent = currentUser.name;
  document.getElementById('sb-role').textContent = ROLE_LABELS[currentUser.role] || currentUser.role;
  document.getElementById('sb-avatar').textContent = ROLE_EMOJI[role] || '👤';

  const navLinks = document.getElementById('nav-links');
  const items = NAV_CONFIG[role] || NAV_CONFIG[currentUser.role] || [];
  navLinks.innerHTML = items.map(i =>
    `<div class="nav-item" onclick="navigate('${i.page}', this)">
      <span class="icon">${i.icon}</span>${i.label}
    </div>`
  ).join('');

  if (items.length) navigate(items[0].page, navLinks.firstElementChild);
}

function navigate(page, el) {
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  if (el) el.classList.add('active');
  renderPage(page);
}

function logout() {
  token = null; currentUser = null;
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('login-error').style.display = 'none';
  document.getElementById('email-input').value = '';
  document.getElementById('pass-input').value = '';
}

function setContent(html) {
  document.getElementById('main-content').innerHTML = html;
}

function loading() {
  setContent('<div class="loading"><div class="spinner"></div>در حال بارگذاری...</div>');
}

// ─── PAGE RENDERERS ───────────────────────────────────

async function renderPage(page) {
  loading();
  switch(page) {
    case 'admin-dashboard':  return renderAdminDashboard();
    case 'admin-users':      return renderAdminUsers();
    case 'admin-books':      return renderAdminBooks();
    case 'admin-lessons':    return renderAdminLessons();
    case 'admin-grants':     return renderAdminGrants();
    case 'school-dashboard': return renderSchoolDashboard();
    case 'school-classes':   return renderSchoolClasses();
    case 'school-grants':    return renderSchoolGrants();
    case 'teacher-classes':  return renderTeacherClasses();
    case 'parent-children':  return renderParentChildren();
    case 'student-books':    return renderStudentBooks();
    case 'student-profile':  return renderStudentProfile();
  }
}

// ── ADMIN DASHBOARD
async function renderAdminDashboard() {
  const res = await api('/admin/reports/overview');
  const d = res.data;
  setContent(`
    <h1 class="page-title">📊 داشبورد مدیریت</h1>
    <div class="api-url">GET /api/admin/reports/overview</div>
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-icon purple">👥</div>
        <div><div class="stat-value">${d.totalUsers}</div><div class="stat-label">کل کاربران</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon orange">🏫</div>
        <div><div class="stat-value">${d.totalSchools}</div><div class="stat-label">مدارس</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green">📖</div>
        <div><div class="stat-value">${d.totalLessons}</div><div class="stat-label">درس‌ها</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon blue">🎮</div>
        <div><div class="stat-value">${d.totalStudents}</div><div class="stat-label">دانش‌آموزان</div></div>
      </div>
    </div>
    <div class="card">
      <div class="card-header">💡 وضعیت سیستم</div>
      <div style="padding:24px">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div style="background:var(--gray-50);border-radius:12px;padding:16px">
            <div style="font-size:12px;color:var(--gray-500);margin-bottom:4px">نسخه API</div>
            <div style="font-weight:700;color:var(--purple)">v1.0.0 — Phase 0</div>
          </div>
          <div style="background:var(--gray-50);border-radius:12px;padding:16px">
            <div style="font-size:12px;color:var(--gray-500);margin-bottom:4px">وضعیت</div>
            <div style="font-weight:700;color:var(--green)">✅ فعال</div>
          </div>
